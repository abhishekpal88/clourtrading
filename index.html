<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Affiliate Community</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.header {
    background: linear-gradient(90deg,#690000,#bd0808,#690000);
    padding: 20px 10px;
    border-bottom: 3px solid gold;
}

.header h1 {
    color: #ffdf37;
    font-size: 35px;
    font-weight: 900;
    text-shadow: 2px 3px 5px black;
}

.container {
    width: 100%;
    max-width: 500px;
    margin: auto;
    padding: 25px 15px;
}

.logo {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid gold;
    box-shadow: 0 0 25px #a87500;
    margin: 15px auto 25px;
}

.banner {
    background: linear-gradient(90deg,#a90016,#ed001e);
    padding: 18px 10px;
    margin: 15px 0 25px;
    font-size: 19px;
    font-weight: bold;
    line-height: 1.6;
    border: 1px solid #ff5b5b;
}

.join-btn {
    display: block;
    width: 100%;
    padding: 20px 10px;
    border-radius: 50px;
    background: linear-gradient(90deg,#3710a0,#6c20dc);
    border: 4px solid white;
    color: white;
    text-decoration: none;
    font-size: 23px;
    font-weight: 900;
    margin: 25px auto;
    box-shadow: 0 0 15px #6228c9;
    cursor: pointer;
}

.join-btn:active {
    transform: scale(.97);
}

.timer-box {
    background: linear-gradient(120deg,#ffe600,#ffbd00);
    border: 5px solid white;
    padding: 15px 5px;
    margin: 30px 0;
    color: #b90000;
}

.timer {
    display: flex;
    justify-content: space-around;
    font-size: 27px;
    font-weight: 900;
}

.labels {
    display: flex;
    justify-content: space-around;
    font-size: 12px;
    font-weight: bold;
    color: black;
    margin-top: 8px;
}

.footer {
    background: linear-gradient(90deg,#a90016,#e00020);
    padding: 20px 10px;
    font-size: 19px;
    font-weight: bold;
    line-height: 1.6;
}

@media(max-width:380px) {
    .header h1 {font-size:28px;}
    .logo {width:220px;height:220px;}
    .join-btn {font-size:19px;}
    .timer {font-size:22px;}
}
</style>
</head>

<body>

<header class="header">
    <h1>VIP COMMUNITY</h1>
</header>

<main class="container">

    <img src="logo.jpg" class="logo" alt="Community Logo">

    <div class="banner">
        🚀 क्या आप भी नई Digital Skills सीखना चाहते हैं?
        हमारी Community से जुड़ें!
    </div>

    <a href="YOUR_VERIFIED_NON_GAMBLING_TELEGRAM_LINK"
       class="join-btn">
       ✈ JOIN VIP CHANNEL ✈
    </a>

    <div class="timer-box">

        <div class="timer">
            <span id="days">00</span>
            <span id="hours">00</span>
            <span id="minutes">00</span>
            <span id="seconds">00</span>
        </div>

        <div class="labels">
            <span>DAYS</span>
            <span>HOURS</span>
            <span>MINUTES</span>
            <span>SECONDS</span>
        </div>

    </div>

</main>

<footer class="footer">
    Welcome To Our Digital Community!
</footer>

<script>
let remaining = 24 * 60 * 60;

function updateTimer() {

    let d = Math.floor(remaining / 86400);
    let h = Math.floor((remaining % 86400) / 3600);
    let m = Math.floor((remaining % 3600) / 60);
    let s = remaining % 60;

    document.getElementById("days").innerText =
        String(d).padStart(2,"0");

    document.getElementById("hours").innerText =
        String(h).padStart(2,"0");

    document.getElementById("minutes").innerText =
        String(m).padStart(2,"0");

    document.getElementById("seconds").innerText =
        String(s).padStart(2,"0");

    remaining--;

    if(remaining < 0) remaining = 24 * 60 * 60;
}

updateTimer();
setInterval(updateTimer,1000);
</script>

</body>
</html>
