<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9K.CLUB</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 680px;
    margin: auto;
    min-height: 100vh;
    background: #050505;
}

.header {
    background: #a40000;
    color: #ffd76a;
    padding: 15px;
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo {
    width: 300px;
    max-width: 85%;
    height: 300px;
    object-fit: cover;
    border-radius: 50%;
    border: 6px solid white;
    margin: 30px auto;
    box-shadow: 0 0 20px #ffb000;
}

.banner {
    background: #c71919;
    padding: 15px;
    margin: 10px 18px 25px;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.5;
}

.info {
    background: #171717;
    border: 2px solid #dca52e;
    border-radius: 15px;
    margin: 20px;
    padding: 25px 15px;
}

.info h2 {
    color: #ffcc44;
}

.info p {
    line-height: 1.6;
}

.note {
    font-size: 12px;
    color: #aaa;
    padding: 15px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        9K.CLUB
    </div>

    <img src="9k-logo.jpg" class="logo" alt="9K.CLUB Logo">

    <div class="banner">
        WELCOME TO 9K.CLUB
    </div>

    <div class="info">
        <h2>9K.CLUB</h2>
        <p>
            Welcome to our entertainment community.
            Explore our brand and community information.
        </p>
    </div>

    <div class="note">
        This page is for general entertainment information.
        No deposits, wagers or financial returns are offered.
    </div>

</div>

</body>
</html>
