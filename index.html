<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9K.CLUB</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 600px;
    min-height: 100vh;
    margin: auto;
    background: #050505;
    text-align: center;
    padding-bottom: 25px;
}

.header {
    background: linear-gradient(90deg,#900000,#e32619,#900000);
    padding: 18px;
    color: #ffdc75;
    font-size: 38px;
    font-weight: 900;
    border-bottom: 2px solid gold;
}

.logo {
    width: 230px;
    height: 230px;
    max-width: 75vw;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid gold;
    margin: 25px auto;
    display: block;
    box-shadow: 0 0 20px orange;
}

.instruction {
    background: #bd1717;
    margin: 10px 15px 25px;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    line-height: 1.6;
}

.join {
    display: block;
    margin: 25px 18px;
    padding: 22px 10px;
    background: linear-gradient(90deg,#32118f,#6724c9);
    border: 4px solid white;
    border-radius: 60px;
    color: white;
    font-size: 23px;
    font-weight: bold;
    text-decoration: none;
}

.timer-box {
    background: #ffdc28;
    border: 6px solid white;
    margin: 25px 28px;
    padding: 15px;
    color: #bd2020;
}

.timer {
    font-size: 36px;
    font-weight: 900;
}

.labels {
    display: flex;
    justify-content: space-around;
    color: black;
    font-size: 13px;
    font-weight: bold;
    margin-top: 8px;
}

.bottom {
    background: #bd101c;
    margin: 20px 10px;
    padding: 18px 10px;
    font-size: 18px;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        9K.CLUB
    </div>

    <img src="9k-logo.jpg" class="logo">

    <div class="instruction">
        WELCOME TO 9K.CLUB
        <br>
        Join Our Official Community
    </div>

    <div class="join">
        ✈ JOIN COMMUNITY ✈
    </div>

    <div class="timer-box">

        <div class="timer" id="timer">
            00 : 00 : 18
        </div>

        <div class="labels">
            <span>MINUTES</span>
            <span>SECONDS</span>
        </div>

    </div>

    <div class="bottom">
        Your Community Invitation Is Ready!
    </div>

</div>

<script>
let seconds = 18;

setInterval(function() {

    if (seconds > 0) {
        seconds--;
    }

    let minutes = Math.floor(seconds / 60);
    let remaining = seconds % 60;

    document.getElementById("timer").innerHTML =
        "00 : " +
        String(minutes).padStart(2, "0") +
        " : " +
        String(remaining).padStart(2, "0");

}, 1000);
</script>

</body>
</html>
