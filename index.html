<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Join Telegram</title>

<!-- META PIXEL -->
<script>

n.callMethod.apply(n,arguments):n.queue.push(arguments)};

n.queue=[];t=b.createElement(e);t.async=!0;

<noscript>
<img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=1910075526819652&ev=PageView&noscript=1">
</noscript>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial,sans-serif;
min-height:100vh;
}

.container{
width:100%;
max-width:480px;
min-height:100vh;
margin:auto;
display:flex;
flex-direction:column;
align-items:center;
padding:125px 15px 30px;
}

.heading{
font-size:clamp(29px,8vw,43px);
font-weight:1000;
text-align:center;
white-space:nowrap;
}

.red{color:#ff001e;}
.yellow{color:#ffff00;}

.arrow{
width:175px;
height:230px;
margin-top:35px;
filter:drop-shadow(0 0 8px #00ff32);
animation:arrowMove .8s ease-in-out infinite alternate;
}

@keyframes arrowMove{
from{transform:translateY(0);}
to{transform:translateY(18px);}
}

.button{
margin-top:15px;
width:min(310px,85%);
height:85px;
background:#fff;
border:9px solid #1700ff;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
color:#1600d9;
font-size:clamp(27px,7vw,38px);
font-weight:1000;
transition:.2s;
}

.button:active{
transform:scale(.95);
}

.timer{
margin-top:25px;
color:#fff;
font-size:18px;
font-weight:bold;
text-align:center;
}

#count{
color:#ffff00;
font-size:25px;
}

@media(max-width:360px){
.container{padding-top:110px;}
}
</style>
</head>

<body>

<div class="container">

<div class="heading">
<span class="red">TELEGRAM</span>
<span class="yellow"> JOIN KRLO</span>
</div>

<!-- MOVING GREEN ARROW -->
<svg class="arrow" viewBox="0 0 180 230">

<path d="M90 15 L90 175"
stroke="#00ff25"
stroke-width="13"
stroke-linecap="round"
fill="none"/>

<path d="M28 125 L90 175 L155 110"
stroke="#00ff25"
stroke-width="13"
stroke-linecap="round"
stroke-linejoin="round"
fill="none"/>

</svg>

<!-- TELEGRAM BUTTON -->
<a class="button"
id="telegramBtn"
href="https://t.me/+mErhNwtQpA9jNzFl"
target="_self">
CLICK HERE
</a>

<!-- COUNTDOWN -->
<div class="timer">
Opening Telegram in <span id="count">3</span> seconds...
</div>

</div>

<script>

// TELEGRAM LINK
const telegramLink = "https://t.me/+mErhNwtQpA9jNzFl";

// COUNTDOWN
let seconds = 3;
let redirected = false;

const countElement = document.getElementById("count");

function openTelegram(){

if(redirected) return;

redirected = true;

if(typeof fbq === "function"){
fbq('trackCustom','TelegramAutoRedirect');
}

window.location.href = telegramLink;

}

const countdown = setInterval(function(){

seconds--;

if(seconds > 0){

countElement.innerText = seconds;

}else{

clearInterval(countdown);
openTelegram();

}

},1000);

</script>
<a class="button"
href="https://t.me/+mErhNwtQpA9jNzFl"
target="_blank">
CLICK HERE
</a>

</body>
</html>
