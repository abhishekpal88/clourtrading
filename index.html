<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9K.CLUB</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 30px;
}

.header {
    background: linear-gradient(90deg,#8d0000,#ed2700,#8d0000);
    padding: 17px;
    font-size: 36px;
    font-weight: 900;
    color: white;
    border-bottom: 2px solid gold;
}

.logo {
    width: 210px;
    height: 210px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid gold;
    margin: 25px auto;
    box-shadow: 0 0 20px orange;
}

.instructions {
    background: #b50000;
    padding: 13px;
    margin: 10px;
    font-weight: bold;
    font-size: 17px;
}

.join {
    display: block;
    background: linear-gradient(90deg,#5100d5,#a000ff);
    color: white;
    padding: 17px;
    margin: 25px 15px;
    border-radius: 8px;
    font-size: 21px;
    font-weight: bold;
    text-decoration: none;
    box-shadow: 0 0 15px #7800ff;
}

.timer {
    background: #ffce00;
    color: black;
    padding: 15px;
    margin: 20px 15px;
    border-radius: 6px;
    font-size: 28px;
    font-weight: bold;
}

.bottom {
    background: #b50000;
    padding: 15px;
    margin: 20px 10px;
    font-weight: bold;
    font-size: 17px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">9K.CLUB</div>

    <img src="9k-logo.jpg" class="logo" alt="9K.CLUB">

    <div class="instructions">
        WELCOME TO 9K.CLUB
    </div>

    <div class="join">
        JOIN VIP CHANNEL
    </div>

    <div class="timer" id="timer">
        05:00
    </div>

    <div class="bottom">
        THANK YOU FOR VISITING 9K.CLUB
    </div>

</div>

<script>
let seconds = 300;

setInterval(function() {
    if(seconds > 0) seconds--;

    let min = Math.floor(seconds / 60);
    let sec = seconds % 60;

    document.getElementById("timer").innerText =
        String(min).padStart(2,'0') + ":" +
        String(sec).padStart(2,'0');

},1000);
</script>

</body>
</html>
