
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegram - Message Now</title>

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];
    t=b.createElement(e);t.async=!0;
    t.src=v;
    s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}
    (window,document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '1350145040492598');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1350145040492598&ev=PageView&noscript=1"/>
  </noscript>
  <!-- End Meta Pixel Code -->

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      padding: 25px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .heading {
      font-size: clamp(30px, 8vw, 48px);
      font-weight: 900;
      white-space: nowrap;
      margin-bottom: 65px;
    }

    .red {
      color: #ff1535;
    }

    .yellow {
      color: #ffff00;
    }

    .arrow {
      width: 180px;
      height: 290px;
      margin-bottom: 65px;
      animation: moveArrow 1s infinite alternate ease-in-out;
      filter: drop-shadow(0 0 12px #00ff22);
    }

    @keyframes moveArrow {
      from { transform: translateY(-12px); }
      to { transform: translateY(12px); }
    }

    .arrow path {
      fill: none;
      stroke: #00ff24;
      stroke-width: 13;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .telegram-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 88%;
      min-height: 125px;
      background: #fff;
      color: #1700c9;
      border: 12px solid #2600ff;
      border-radius: 32px;
      font-size: clamp(30px, 8vw, 44px);
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(40, 0, 255, .3);
    }

    .telegram-btn:active {
      transform: scale(.97);
    }

    .timer {
      font-size: clamp(19px, 5vw, 27px);
      font-weight: bold;
      margin-top: 55px;
    }

    .timer span {
      color: #ffff00;
    }

    @media (max-width: 380px) {
      .heading {
        font-size: 27px;
      }

      .arrow {
        width: 150px;
        height: 240px;
      }

      .telegram-btn {
        min-height: 105px;
        border-width: 9px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1 class="heading">
      <span class="red">TELEGRAM</span>
      <span class="yellow">MSG KRO</span>
    </h1>

    <!-- Animated green arrow -->
    <svg class="arrow" viewBox="0 0 180 290"
         xmlns="http://www.w3.org/2000/svg">
      <path d="M90 15 V265 M15 190 L90 265 L165 190"/>
    </svg>

    <!-- Telegram message button -->
    <a
      class="telegram-btn"
      id="telegramButton"
      href="https://t.me/Radha7h?text=YES%2C%20I%27M%20INTERESTED%20IN%20WORK%20%E2%8F%B0%20I%27M%2018%2B">
      MSG KRO
    </a>

    <p class="timer" id="timerText">
      Opening Telegram in <span id="seconds">2</span> seconds...
    </p>

  </main>

  <script>
    const telegramLink =
      "https://t.me/Radha7h?text=YES%2C%20I%27M%20INTERESTED%20IN%20WORK%20%E2%8F%B0%20I%27M%2018%2B";

    const button = document.getElementById("telegramButton");
    const secondsText = document.getElementById("seconds");
    let remaining = 2;
    let redirected = false;

    function openTelegram(isButtonClick) {
      if (redirected) return;
      redirected = true;

      if (typeof fbq === "function") {
        if (isButtonClick) {
          fbq("track", "Contact");
        } else {
          fbq("trackCustom", "TelegramRedirect");
        }
      }

      // Brief delay gives the pixel event a chance to send.
      setTimeout(function () {
        window.location.href = telegramLink;
      }, 300);
    }

    button.addEventListener("click", function (event) {
      event.preventDefault();
      openTelegram(true);
    });

    const countdown = setInterval(function () {
      remaining--;
      secondsText.textContent = remaining;

      if (remaining <= 0) {
        clearInterval(countdown);
        document.getElementById("timerText").textContent =
          "Opening Telegram...";

        openTelegram(false);
      }
    }, 1000);
  </script>
</body>
</html>
