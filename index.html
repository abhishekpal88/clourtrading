<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9K.CLUB</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #000;
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    width: 100%;
    max-width: 680px;
    margin: auto;
    background: #000;
    text-align: center;
    min-height: 100vh;
}

.header {
    background: #a50000;
    padding: 18px 5px;
    color: #ffdf78;
    font-size: 40px;
    font-weight: bold;
}

.logo {
    width: 230px;
    height: 230px;
    border-radius: 50%;
    border: 7px solid white;
    object-fit: cover;
    margin: 28px auto;
    display: block;
    box-shadow: 0 0 20px white;
}

.instruction {
    background: #c71920;
    margin: 10px 18px 25px;
    padding: 12px;
    font-size: 19px;
    font-weight: bold;
    line-height: 1.5;
}

.join-btn {
    display: block;
    margin: 25px 18px;
    padding: 24px 10px;
    border-radius: 60px;
    background: linear-gradient(90deg,#3210a2,#4b239f);
    border: 5px solid white;
    color: white;
    font-size: 25px;
    font-weight: bold;
    text-decoration: none;
}

.timer-box {
    background: #ffdb28;
    border: 8px solid white;
    margin: 28px 35px;
    padding: 12px 5px;
    color: #c92330;
}

.timer {
    font-size: 38px;
    font-weight: bold;
}

.labels {
    display: flex;
    justify-content: space-around;
    color: black;
    font-size: 17px;
    font-weight: bold;
    margin-top: 10px;
}

.bottom {
    background: #c90020;
    padding: 18px 5px;
    font-size: 25px;
    font-weight: bold;
    line-height: 1.5;
    margin-top: 25px;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">
        9K.CLUB
    </div>

    <img src="9k-logo.jpg" class="logo">

    <div class="instruction">
        💸 क्या आप भी पैसा कमाना चाहते हैं?
        नीचे JOIN MY COMMUNITY के Button पर Click करें 🎯
    </div>

    <div class="join-btn">
        ✈ JOIN VIP CHANNEL ✈
    </div>

    <div class="timer-box">

        <div class="timer" id="timer">
            00 : 00 : 00 : 18
        </div>

        <div class="labels">
            <span>DAYS</span>
            <span>HOURS</span>
            <span>MINUTES</span>
            <span>SECONDS</span>
        </div>

    </div>

    <div class="bottom">
        Your request will be accepted within 2 seconds.
    </div>

</div>

<script>
let seconds = 18;

setInterval(() => {
    if (seconds > 0) seconds--;

    document.getElementById("timer").innerText =
    "00 : 00 : 00 : " +
    String(seconds).padStart(2, "0");

}, 1000);
</script>

</body>
</html>
